// ─── Computed Indicator Components ───────────────────────────────────────────
const fp = (v, digits=2) => v != null ? Number(v).toLocaleString(undefined, {maximumFractionDigits: digits}) : '—';
const fmtPct = v => v != null ? (v >= 0 ? `+${v.toFixed(1)}%` : `${v.toFixed(1)}%`) : '';
const pctColor = v => v == null ? '#94a3b8' : v >= 0 ? '#34d399' : '#f87171';

function MaRow({label, maVal, price}) {
  if (maVal == null) return null;
  const above = price > maVal;
  const pct = (price / maVal - 1) * 100;
  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid #1e293b',fontSize:'.82rem'}}>
      <span style={{color:'#94a3b8',minWidth:80}}>{label}</span>
      <span style={{color:'#e2e8f0',fontVariantNumeric:'tabular-nums'}}>${fp(maVal)}</span>
      <span style={{color: above ? '#34d399' : '#f87171', fontSize:'.78rem'}}>
        {above ? '▲' : '▼'} {fmtPct(pct)}
      </span>
    </div>
  );
}

function ComputedTechSection({computed}) {
  if (!computed) return null;
  const {ma, vwma: vw, bb, rsi14, price} = computed;

  let rsiColor = '#fbbf24';
  let rsiLabel = '중립';
  if (rsi14 != null) {
    if (rsi14 >= 70) { rsiColor = '#f87171'; rsiLabel = '과매수'; }
    else if (rsi14 <= 30) { rsiColor = '#34d399'; rsiLabel = '과매도'; }
  }

  return (
    <div style={{background:'#0f172a',border:'1px solid #334155',borderRadius:8,padding:14,marginBottom:12}}>
      <div style={{fontSize:'.8rem',fontWeight:700,color:'#60a5fa',marginBottom:10}}>📐 계산된 기술 지표</div>

      {/* RSI */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid #1e293b',fontSize:'.82rem',marginBottom:4}}>
        <span style={{color:'#94a3b8'}}>RSI(14)</span>
        <span style={{color:rsiColor,fontWeight:700}}>{rsi14 != null ? rsi14.toFixed(1) : '—'}</span>
        <span style={{color:rsiColor,fontSize:'.78rem'}}>{rsiLabel}</span>
      </div>

      {/* Moving Averages */}
      <MaRow label="MA20"     maVal={ma.ma20}  price={price}/>
      <MaRow label="MA50"     maVal={ma.ma50}  price={price}/>
      <MaRow label="MA99"     maVal={ma.ma99}  price={price}/>
      <MaRow label="MA200"    maVal={ma.ma200} price={price}/>
      <MaRow label="VWMA100"  maVal={vw.vwma100} price={price}/>

      {/* Bollinger Bands */}
      {bb && (
        <div style={{marginTop:6,fontSize:'.82rem'}}>
          <div style={{color:'#8794a8',marginBottom:4}}>볼린저밴드 (20,2)</div>
          <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
            <span>상단 <b style={{color:'#f87171'}}>${fp(bb.upper)}</b></span>
            <span>중간 <b style={{color:'#94a3b8'}}>${fp(bb.mid)}</b></span>
            <span>하단 <b style={{color:'#34d399'}}>${fp(bb.lower)}</b></span>
          </div>
        </div>
      )}
    </div>
  );
}

function FibSection({computed, ticker}) {
  const cs = currencySym(ticker);
  if (!computed) return null;
  const {fibs, fibExts, fib90, price, rounds} = computed;
  return (
    <details style={{background:'#0f172a',border:'1px solid #334155',borderRadius:8,padding:14,marginBottom:12}}>
      <summary style={{cursor:'pointer',fontSize:'.84rem',fontWeight:700,color:'#a78bfa',userSelect:'none'}}>
        📐 피보나치 레벨 · 라운드넘버 <span style={{color:'#94a3b8',fontWeight:500}}>(최근 {computed.swingBars||90}봉 {computed.fibDir==='down'?'하락':'상승'} 스윙: 저 {cs}{fp(fib90?.low)} / 고 {cs}{fp(fib90?.high)})</span>
      </summary>

      <div className="fib-grid" style={{marginTop:12}}>
        {/* Retracements */}
        <div>
          <div style={{color:'#8794a8',fontSize:'.75rem',marginBottom:6}}>{computed.fibDir==='down' ? '되돌림 (반등 시 저항)' : '되돌림 (지지)'}</div>
          {fibs.map(f => (
            <div key={f.level} className="fib-row">
              <span style={{color:'#94a3b8'}}>Fib {f.level}</span>
              <span style={{color:'#e2e8f0'}}>{cs}{fp(f.price)}</span>
              <span style={{color:pctColor(f.pct),fontSize:'.75rem'}}>{fmtPct(f.pct)}</span>
            </div>
          ))}
        </div>

        {/* Extensions */}
        <div>
          <div style={{color:'#8794a8',fontSize:'.75rem',marginBottom:6}}>{computed.fibDir==='down' ? '확장 (하락 목표)' : '확장 (목표)'}</div>
          {fibExts.map(f => (
            <div key={f.level} className="fib-row">
              <span style={{color:'#94a3b8'}}>Ext {f.level}</span>
              <span style={{color:'#e2e8f0'}}>{cs}{fp(f.price)}</span>
              <span style={{color:pctColor(f.pct),fontSize:'.75rem'}}>{fmtPct(f.pct)}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Round numbers */}
      {rounds && rounds.length > 0 && (
        <div style={{marginTop:10}}>
          <div style={{color:'#8794a8',fontSize:'.75rem',marginBottom:6}}>심리적 라운드넘버</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
            {rounds.map(r => (
              <span key={r.level} style={{
                background: r.role === '저항' ? '#450a0a' : '#064e3b',
                color: r.role === '저항' ? '#f87171' : '#34d399',
                borderRadius:4, padding:'2px 8px', fontSize:'.78rem',
              }}>
                {cs}{fp(r.level)} {fmtPct(r.pct)} ({r.role})
              </span>
            ))}
          </div>
        </div>
      )}
    </details>
  );
}

function TradePlanSection({computed, report}) {
  const plan = computed?.tradePlan;
  if (!plan) return null;
  const ticker = report?.ticker;
  const price = computed.price;
  const isLong = plan.direction === 'long';
  const side = isLong ? 1 : -1;
  const stance = stanceOf(report);
  if (stance === 'avoid') return (
    <div style={{background:'#0a0f1a',border:'1px solid #7f1d1d',borderRadius:10,padding:'14px 16px',marginBottom:12,fontSize:'.83rem',color:'#fca5a5',lineHeight:1.7}}>
      ✕ <b>매수 회피 구간</b> — 지표 점수가 −25 이하라 매수 플랜을 제시하지 않습니다.<br/>
      <span style={{color:'#8794a8'}}>숏(공매도) 플랜은 제공하지 않습니다. 과거 검증(코인 10종, 2019~2026)에서 하락 신호의 예측력이 확인되지 않았습니다.</span>
    </div>
  );
  const distPct = v => (v/price - 1) * 100;
  const retPct  = v => side * (v/plan.entry1 - 1) * 100;

  const rows = [
    {label: plan.entryMode==='market' ? '진입 (현재가 부근)' : '진입 1차 (지정가)', val:plan.entry1, color:'#34d399', kind:'entry'},
    {label: '진입 2차 (분할)', val:plan.entry2, color:'#34d399', kind:'entry'},
    {label: '익절 1차', val:plan.profit1, rr:plan.rr1, color:'#4ade80', kind:'tp'},
    {label: '익절 2차', val:plan.profit2, rr:plan.rr2, color:'#4ade80', kind:'tp'},
    {label: '익절 3차', val:plan.profit3, rr:plan.rr3, color:'#4ade80', kind:'tp'},
    {label: '손절',     val:plan.stopLoss,              color:'#f87171', kind:'sl'},
  ].filter(r => r.val != null);

  const th = {padding:'9px 12px',textAlign:'right',fontSize:'.74rem',fontWeight:700,color:'#8794a8',letterSpacing:'0.08em',whiteSpace:'nowrap'};
  const dirColor = isLong ? '#4ade80' : '#f87171';

  return (
    <div style={{background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:10,overflow:'hidden',marginBottom:12}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8,padding:'10px 12px',borderBottom:'1px solid #1e293b',background:'#0f172a'}}>
        <span style={{fontWeight:800,fontSize:'.85rem',color:dirColor}}>{isLong ? '▲ 롱 플랜' : '▼ 숏 플랜'}</span>
        {stance==='neutral' && <span style={{fontSize:'.74rem',color:'#fbbf24'}}>⚠ 관망 구간(점수 ±25 이내) — 참고용 조건부 시나리오입니다</span>}
        {stance==='bear' && <span style={{fontSize:'.74rem',color:'#fb923c'}}>⚠ BTC가 200일선 아래 — 과거 하락장(2022)에서 롱 신호는 손실이었습니다. 진입 비권장</span>}
      </div>
      <div style={{overflowX:'auto'}}>
      <table className="plan-table" style={{width:'100%',borderCollapse:'collapse',minWidth:420}}>
        <thead>
          <tr style={{borderBottom:'1px solid #1e293b'}}>
            <th style={{...th,textAlign:'left'}}>레벨</th>
            <th style={th}>가격</th>
            <th className="col-sub" style={th}>현재가 대비</th>
            <th className="col-sub" style={th}>R:R</th>
            <th style={th}>예상 손익</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((r,i)=>{
            const d = distPct(r.val);
            const ret = r.kind==='entry' ? null : retPct(r.val);
            return (
              <tr key={i} style={{borderBottom:'1px solid #0f172a',background:i%2===0?'#0a0f1a':'#0d1424'}}>
                <td style={{padding:'10px 12px',color:r.color,fontWeight:700,fontSize:'.85rem',whiteSpace:'nowrap'}}>{r.label}
                  <div className="mob-only">현재가 대비 {`${d>=0?'+':''}${d.toFixed(2)}%`}{r.rr!=null ? ` · R:R ${r.rr.toFixed(2)}` : ''}</div></td>

                <td className="col-sub" style={{padding:'10px 12px',textAlign:'right',fontSize:'.8rem',color:'#8794a8'}}>{`${d>=0?'+':''}${d.toFixed(2)}%`}</td>

                  {ret==null ? '—' : `${ret>=0?'+':''}${ret.toFixed(2)}%`}

      </div>
    </div>
  );
}

          ? <>진입 <b>{px(p.entry1)}</b>{p.entryMode==='market'?' (현재가 부근)':' (지정가)'} · 손절 <b style={{color:'#fb923c'}}>{px(p.stopLoss)}</b> · 1차 목표 <b style={{color:'#a78bfa'}}>{px(p.profit1)}</b> <span style={{color:'#94a3b8'}}>(R:R {p.rr1?.toFixed(1)})</span></>
          : sk==='neutral' ? <>신규 진입 보류 — 점수가 ±25 안쪽(관망)입니다. 보유 중이면 손절선 <b style={{color:'#fb923c'}}>{px(p.stopLoss)}</b> 관리</>
          : sk==='avoid'   ? <>신규 매수 보류 — 하락 우위 구간입니다. 보유 중이면 비중 축소를 검토하세요</>
          :                  <>신규 롱 보류 — BTC가 200일선 아래입니다 (과거 하락장에서 롱 신호는 손실)</>;
        const ai = !report._local && report.summary ? (report.summary.split(/(?<=[.!?。]|다\.)\s+/)[0] || '').slice(0, 160) : '';
        return (
          <div className="action-box">
            <div><span className="k">지금 할 일</span>{text}</div>
            {ai && <div style={{marginTop:6,color:'#cbd5e1',fontSize:'.86rem'}}><span className="k">AI 요약</span>{ai}</div>}
          </div>
        );
      })()}
      {(stats || report.regime) && (
        <div style={{display:'flex',flexWrap:'wrap',gap:'6px 16px',fontSize:'.76rem',color:'#8794a8',marginBottom:12,padding:'8px 12px',background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:8}}>
          {stats && <span>📊 과거 실측 ({EMPIRICAL_CRYPTO_1D.period}, n={stats.n}): 20일 후 평균 <b style={{color:stats.avg>=0?'#4ade80':'#f87171'}}>{stats.avg>=0?'+':''}{stats.avg}%</b> · 중앙값 <b style={{color:stats.med>=0?'#4ade80':'#f87171'}}>{stats.med>=0?'+':''}{stats.med}%</b> <span style={{color:'#8794a8'}}>(전체 평균 +{EMPIRICAL_CRYPTO_1D.all.avg}% · 상승 {EMPIRICAL_CRYPTO_1D.all.up}%)</span></span>}
          {report.regime && (report.regime.unknown
            ? <span>₿ BTC 국면 확인 실패 — 하락장 필터 미적용</span>
            : <span>₿ BTC {report.regime.btcAbove ? <b style={{color:'#4ade80'}}>200일선 위</b> : <b style={{color:'#fb923c'}}>200일선 아래 (하락장 필터 작동)</b>} · {fmtPx(report.regime.btcPrice,'BTC')} / MA200 {fmtPx(report.regime.btcMa200,'BTC')}</span>)}
        </div>
      )}
      {report.signals?.length>0 && (
        <div>
          <div style={{fontSize:'.76rem',fontWeight:700,color:'#8794a8',letterSpacing:'0.1em',marginBottom:6}}>KEY SIGNALS (지표 기반)</div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {report.signals.map((s,i)=>{
              const c = palette[report.signalsTone?.[i]] || palette.neu;
              return <span key={i} style={{background:c.bg,border:`1px solid ${c.border}`,color:c.color,borderRadius:20,padding:'4px 12px',fontSize:'.78rem',fontWeight:600}}>{s}</span>;
            })}
          </div>
        </div>
      )}
      {aiPending && (
        <div style={{display:'flex',alignItems:'center',gap:8,marginTop:12,fontSize:'.8rem',color:'#8794a8'}}>
          <div className="spinner" style={{width:14,height:14,borderWidth:2}}/>
          AI 해설 생성 중... (판정·점수·매매 플랜은 지표 계산으로 이미 확정)
        </div>
      )}
      {(report._dataError||report._noData) && (
        <div className="alert-box alert-warn" style={{marginTop:10,fontSize:'.82rem'}}>
          {report._dataError||'📊 차트 데이터 없음 — 텍스트 기반 분석입니다.'}
        </div>
      )}
    </div>
  );
}

function AnalysisSection({report}) {
  const [open, setOpen] = React.useState(true);
  const [techExpanded, setTechExpanded] = React.useState(false);
  if(!report) return null;
  const computed = report.computed;
  const ticker = report.ticker;
  const curPrice = report.price ? Number(report.price) : null;

  const PriceTag = ({val, label, color, icon}) => {
    if(val==null) return null;
    const n=Number(val), pct=curPrice?((n-curPrice)/curPrice*100):null;
    const dc=pct==null?'#64748b':pct>=0?'#4ade80':'#f87171';
    return (
      <div style={{minWidth:0,background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:10,padding:'12px 8px',textAlign:'center'}}>
        <div style={{fontSize:'.74rem',color:'#8794a8',fontWeight:600,marginBottom:4}}>{icon} {label}</div>
        <div style={{fontSize:'.98rem',fontWeight:800,color,fontFamily:'monospace',overflowWrap:'anywhere'}}>{fmtPx(val,ticker)}</div>
        {pct!=null && <div style={{fontSize:'.76rem',fontWeight:700,color:dc,marginTop:3}}>{pct>=0?`▲ +${pct.toFixed(1)}%`:`▼ ${pct.toFixed(1)}%`}</div>}
      </div>
    );
  };
  const MetricRow = ({label, value, valueColor}) => (
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'7px 0',borderBottom:'1px solid #0f172a',fontSize:'.82rem'}}>
      <span style={{color:'#8794a8'}}>{label}</span>
      <span style={{color:valueColor||'#e2e8f0',fontWeight:700,textAlign:'right'}}>{value}</span>
    </div>
  );

  const rsi14 = computed?.rsi14;
  const rsiColor = rsi14==null?'#94a3b8':rsi14>=70?'#f87171':rsi14<=30?'#4ade80':'#fbbf24';
  const bb = computed?.bb;
  const macd = computed?.macd;
  const vt = computed?.volTrend;
  const tech = report.technical || '';
  const facts = computed?.facts || [];
  const pos = report.position;

  return (
    <div className="card">
      <div className="card-title" style={{cursor:'pointer',userSelect:'none',justifyContent:'space-between'}} onClick={()=>setOpen(o=>!o)}>
        <span>📊 기술적 분석</span><span style={{fontSize:'.9rem',color:'#8794a8'}}>{open?'▲':'▼'}</span>
      </div>
      {open && <>

      {/* 지표 점수 분해 */}
      {report.scoreBreakdown && (
        <div style={{background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:10,padding:'12px 14px',marginBottom:16}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:10,flexWrap:'wrap',gap:6}}>
            <span style={{fontSize:'.75rem',fontWeight:700,color:'#8794a8',letterSpacing:'0.08em'}}>🧮 지표 점수 분해</span>
            <span style={{fontSize:'.78rem',color:'#8794a8'}}>
              합계 <b style={{color:report.score>=25?'#4ade80':report.score<=-25?'#f87171':'#fbbf24',fontSize:'.95rem'}}>{report.score>0?'+':''}{report.score}</b> / ±100 · 롱 ≥ +25 · 매수 회피 ≤ −25
            </span>
          </div>
          {report.scoreBreakdown.map(c=>(
            <div key={c.key} className="score-row">
              <span style={{color:'#94a3b8'}}>{c.label} <span style={{color:'#8794a8'}}>({c.weight})</span></span>
              <div className="bar" style={{position:'relative',height:8,background:'#111827',borderRadius:4}}>
                <div style={{position:'absolute',left:'50%',top:-2,bottom:-2,width:1,background:'#334155'}}/>
                <div style={{position:'absolute',top:0,bottom:0,borderRadius:4,
                  left: c.value>=0 ? '50%' : `${50 + c.value*50}%`,
                  width: `${Math.abs(c.value)*50}%`,
                  background: c.value>=0 ? '#22c55e' : '#ef4444'}}/>
              </div>
              <span className="note" style={{color:'#94a3b8'}}>
                <b style={{color:c.contrib>0?'#4ade80':c.contrib<0?'#f87171':'#94a3b8'}}>{c.contrib>0?'+':''}{c.contrib.toFixed(1)}</b> · {c.note}
              </span>
            </div>
          ))}
        </div>
      )}

      {/* 매매 플랜 */}
      <div style={{marginBottom:16}}>
        <div style={{fontSize:'.75rem',fontWeight:700,color:'#8794a8',letterSpacing:'0.08em',marginBottom:8}}>🎯 매매 플랜 (지표 계산 기반 · 롱 전용)</div>
        <TradePlanSection computed={computed} report={report}/>
      </div>

      {/* 핵심 가격대 */}
      <div className="price-tags">
        <PriceTag val={report.support}      label="가까운 지지"  color="#4ade80" icon="🟢"/>
        <PriceTag val={report.resistance}   label="가까운 저항"  color="#f87171" icon="🔴"/>
        <PriceTag val={report.target_price} label="1차 목표"     color="#a78bfa" icon="🎯"/>
        <PriceTag val={report.stop_loss}    label="손절"         color="#fb923c" icon="⛔"/>
      </div>

      {/* 기술 지표 좌우 분할 */}
      {computed && (
        <div style={{background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:10,overflow:'hidden',marginBottom:12}}>
          <div style={{padding:'12px 14px',borderBottom:'1px solid #1e293b',fontSize:'.78rem',fontWeight:700,color:'#8794a8',letterSpacing:'0.08em'}}>기술 지표</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:0}}>
            <div style={{padding:'14px',borderRight:'1px solid #1e293b'}}>
              <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
                <div style={{fontSize:'1.4rem',lineHeight:1}}>📈</div>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:'.76rem',fontWeight:700,color:'#60a5fa',letterSpacing:'0.08em',marginBottom:6}}>요약</div>
                  {tech ? (
                    <>
                      <div style={{fontSize:'.82rem',color:'#94a3b8',lineHeight:1.7}}>
                        {techExpanded ? tech : tech.slice(0,140)+(tech.length>140?'…':'')}
                      </div>
                      {tech.length>140 && (
                        <button onClick={()=>setTechExpanded(v=>!v)} style={{marginTop:8,background:'none',border:'none',color:'#3b82f6',cursor:'pointer',fontSize:'.78rem',padding:0,fontWeight:600}}>
                          {techExpanded?'접기 ▲':'전체 보기 ▼'}
                        </button>
                      )}
                    </>
                  ) : (
                    <div style={{fontSize:'.8rem',color:'#8794a8'}}>AI 해설 대기 중 — 아래는 지표에서 직접 계산한 사실입니다.</div>
                  )}
                  {facts.length>0 && (
                    <ul style={{margin:'10px 0 0',paddingLeft:16,fontSize:'.78rem',color:'#8794a8',lineHeight:1.7}}>
                      {facts.map((f,i)=><li key={i}>{f}</li>)}
                    </ul>
                  )}
                </div>
              </div>
            </div>
            <div style={{padding:'14px'}}>
              {rsi14!=null && <MetricRow label={`RSI(${computed.rsiPeriod})`} value={rsi14.toFixed(1)} valueColor={rsiColor}/>}
              {computed.maSet.filter(m=>m.v!=null && curPrice).map(m=>{
                const p=(curPrice/m.v-1)*100;
                return <MetricRow key={m.n} label={`MA${m.n} 대비`} value={`${p>=0?'+':''}${p.toFixed(2)}%`} valueColor={p>=0?'#4ade80':'#f87171'}/>;
              })}
              {macd && macd.hist!=null && <MetricRow label="MACD 히스토그램" value={macd.hist>=0?'양(+) 강세':'음(−) 약세'} valueColor={macd.hist>=0?'#4ade80':'#f87171'}/>}
              {bb && curPrice && <MetricRow label="볼린저밴드" value={curPrice>=bb.upper?'상단 돌파':curPrice<=bb.lower?'하단 이탈':'밴드 내부'} valueColor={curPrice>=bb.upper?'#f87171':curPrice<=bb.lower?'#4ade80':'#94a3b8'}/>}
              {computed.atrPct!=null && <MetricRow label="ATR 변동성" value={`${computed.atrPct.toFixed(2)}%`} valueColor="#94a3b8"/>}
              {vt && <MetricRow label="거래량 추세" value={`5봉/20봉 ${vt.r5_20.toFixed(2)}배`} valueColor={vt.r5_20>=1.2?'#4ade80':vt.r5_20<=0.8?'#f87171':'#94a3b8'}/>}
              <MetricRow label="종합 판정" value={STANCE_UI[stanceOf(report)].sub} valueColor={STANCE_UI[stanceOf(report)].color}/>
            </div>
          </div>
        </div>
      )}

      <FibSection computed={computed} ticker={ticker}/>
      </>}
    </div>
  );
}

// ─── 내 포지션 전략 카드 ──────────────────────────────────────────────────────
const POSITIONS_KEY = 'cs_positions';
function PositionAdvisor({report}) {
  const ticker = (report?.ticker || '').toUpperCase();
  const isCrypto = report?.market === 'crypto';
  const [open, setOpen] = React.useState(true);
  const [f, setF] = React.useState(() => {
    const saved = (ls_get(POSITIONS_KEY, {}) || {})[ticker];
    if (saved) return saved;
    const pf = (loadPortfolio() || []).find(p => (p.ticker||'').toUpperCase() === ticker);
    return {futures:false, side:'long', lev:'3', avg: pf ? String(pf.avgCost) : '', weight:'', total:''};
  });
  React.useEffect(() => {
    if (!ticker) return;
    const all = ls_get(POSITIONS_KEY, {}) || {};
    all[ticker] = f; ls_set(POSITIONS_KEY, all);
  }, [f, ticker]);
  if (!report?.computed) return null;
  const c = report.computed;
  const set = (k, v) => setF(prev => ({...prev, [k]: v}));
  const futures = isCrypto && f.futures;
  const adv = buildPositionAdvice(
    {avg: parseFloat(f.avg), weightPct: parseFloat(f.weight), lev: parseFloat(f.lev), futures, side: f.side},
    {price: report.price, atr: c.atr, levels: c.levels, stance: stanceOf(report), plan: c.tradePlan});
  const total = parseFloat(f.total) > 0 ? parseFloat(f.total) : null;
  const money = pct => total ? ` (${Math.round(total*pct/100).toLocaleString()})` : '';
  const sgn = v => { const x = Math.abs(v) < 0.005 ? 0 : v; return `${x>=0?'+':''}${x.toFixed(2)}%`; };
  const col = v => Math.abs(v) < 0.005 ? '#94a3b8' : v>=0 ? '#4ade80' : '#f87171';
  const tipColor = {danger:'#f87171', warn:'#fbbf24', info:'#93c5fd', ok:'#4ade80'};
  const tipIcon  = {danger:'⛔', warn:'⚠️', info:'💡', ok:'✅'};
  const seg = (on) => ({padding:'5px 12px',border:'1px solid #334155',background:on?'linear-gradient(135deg,#3b82f6,#6366f1)':'#0f172a',color:on?'#fff':'#94a3b8',cursor:'pointer',fontSize:'.8rem',fontWeight:600});
  const inp = {width:'100%',padding:'7px 10px',background:'#0f172a',border:'1px solid #334155',borderRadius:6,color:'#e2e8f0',fontSize:'.85rem'};
  const lab = {fontSize:'.76rem',color:'#8794a8',marginBottom:4,display:'block'};
  const Box = ({label, value, color, sub}) => (
    <div style={{flex:'1 1 140px',background:'#0a0f1a',border:'1px solid #1e293b',borderRadius:8,padding:'10px 12px'}}>
      <div style={{fontSize:'.74rem',color:'#8794a8',marginBottom:3}}>{label}</div>
      <div style={{fontSize:'.98rem',fontWeight:800,color:color||'#e2e8f0',fontFamily:'monospace'}}>{value}</div>
      {sub && <div style={{fontSize:'.74rem',color:'#8794a8',marginTop:2}}>{sub}</div>}
    </div>
  );

  return (
    <div className="card">
      <div className="card-title" style={{cursor:'pointer',userSelect:'none',justifyContent:'space-between'}} onClick={()=>setOpen(o=>!o)}>
        <span>🧭 내 포지션 전략</span><span style={{fontSize:'.9rem',color:'#8794a8'}}>{open?'▲':'▼'}</span>
      </div>
      {open && <>
      <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end',marginBottom:14}}>
        <div>
          <span style={lab}>거래 유형</span>
          <div style={{display:'flex'}}>
            <button style={{...seg(!futures),borderRadius:'6px 0 0 6px'}} onClick={()=>set('futures',false)}>현물</button>
            <button style={{...seg(futures),borderRadius:'0 6px 6px 0',opacity:isCrypto?1:0.4,cursor:isCrypto?'pointer':'not-allowed'}}
              onClick={()=>isCrypto && set('futures',true)} title={isCrypto?'':'선물(레버리지)은 코인에서만 지원'}>선물(레버리지)</button>
          </div>
        </div>
        {futures && <>
          <div>
            <span style={lab}>방향</span>
            <div style={{display:'flex'}}>
              <button style={{...seg(f.side==='long'),borderRadius:'6px 0 0 6px'}} onClick={()=>set('side','long')}>롱</button>
              <button style={{...seg(f.side==='short'),borderRadius:'0 6px 6px 0'}} onClick={()=>set('side','short')}>숏</button>
            </div>
          </div>
          <div style={{width:90}}>
            <span style={lab}>레버리지(배)</span>
            <input style={inp} type="number" min="1" max="125" value={f.lev} onChange={e=>set('lev',e.target.value)}/>
          </div>
        </>}
        <div style={{flex:'1 1 130px'}}>
          <span style={lab}>평균 단가 ({currencySym(ticker)})</span>
          <input style={inp} type="number" placeholder={String(report.price ?? '')} value={f.avg} onChange={e=>set('avg',e.target.value)}/>
        </div>
        <div style={{flex:'1 1 110px'}}>
          <span style={lab}>비중 (총자산 대비 %{futures?', 증거금':''})</span>
          <input style={inp} type="number" min="0" max="100" placeholder="예: 20" value={f.weight} onChange={e=>set('weight',e.target.value)}/>
        </div>
        <div style={{flex:'1 1 130px'}}>
          <span style={lab}>총자산 (선택, 금액 표시용)</span>
          <input style={inp} type="number" placeholder="예: 10000000" value={f.total} onChange={e=>set('total',e.target.value)}/>
        </div>
      </div>

      {!adv ? (
        <div style={{fontSize:'.83rem',color:'#8794a8',padding:'6px 0 4px'}}>평균 단가와 비중을 입력하면 손익·손절 시 계좌 손실{isCrypto?'·청산가':''}와 전략을 계산합니다. 입력값은 이 브라우저에 종목별로 저장됩니다.</div>
      ) : <>
        <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',marginBottom:12,padding:'10px 14px',borderRadius:8,
          background: adv.sev==='danger'?'#450a0a':adv.sev==='warn'?'#451a03':'#052e16',
          border:`1px solid ${adv.sev==='danger'?'#7f1d1d':adv.sev==='warn'?'#92400e':'#166534'}`}}>
          <span style={{fontWeight:900,fontSize:'1rem',color:adv.sev==='danger'?'#f87171':adv.sev==='warn'?'#fbbf24':'#4ade80'}}>{adv.headline}</span>
          <span style={{fontSize:'.76rem',color:'#94a3b8'}}>판정: {STANCE_UI[stanceOf(report)].label} · {STANCE_UI[stanceOf(report)].sub}</span>
        </div>

        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:12}}>
          <Box label="현재 손익 (가격 기준)" value={sgn(adv.movePct)} color={col(adv.movePct)} sub={adv.lev>1 ? `증거금 기준 ${sgn(adv.marginPct)}` : null}/>
          <Box label="계좌 영향" value={sgn(adv.accountPct)} color={col(adv.accountPct)} sub={total ? `약 ${Math.round(total*adv.accountPct/100).toLocaleString()}` : null}/>
          <Box label="실질 노출 (총자산 대비)" value={`${adv.exposurePct.toFixed(0)}%`} color={adv.exposurePct>100?'#fbbf24':'#e2e8f0'} sub={`비중 ${f.weight}% × ${adv.lev}배`}/>
          <Box label="보호 손절선" value={fmtPx(adv.stop, ticker)} color="#fb923c" sub={`${adv.stopSrc} · 현재가 대비 ${sgn(adv.stopMovePct)}`}/>
          <Box label="손절 시 추가 손실 (계좌)" value={`-${adv.riskFromNow.toFixed(2)}%${money(adv.riskFromNow)}`} color={adv.riskFromNow>ACCOUNT_RISK_LIMIT?'#f87171':'#94a3b8'} sub={`권장 ${ACCOUNT_RISK_LIMIT}% 이하 · 평단 기준 ${sgn(adv.accountAtStop)}`}/>

function SearchAutocomplete({value, onChange, onSearch, placeholder}) {
  const [open, setOpen] = useState(false);
  const [filtered, setFiltered] = useState([]);
  const ref = useRef(null);

  useEffect(()=>{
    const handle = e => { if(ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handle);
    return ()=>document.removeEventListener('mousedown', handle);
  },[]);

  const handleChange = v => {
    onChange(v);
    if(v.length>0) {
      const f = SUGGESTIONS.filter(s=>
        s.q.toLowerCase().includes(v.toLowerCase()) ||
        s.label.toLowerCase().includes(v.toLowerCase())
      );
      setFiltered(f); setOpen(f.length>0);
    } else { setOpen(false); }
  };

  const select = s => { onChange(s.q); setOpen(false); onSearch&&onSearch(s.q); };

  return (
    <div className="search-wrap" ref={ref}>
      <input value={value} onChange={e=>handleChange(e.target.value)}
        placeholder={placeholder||'종목명 / 티커 (예: AAPL, 삼성, BTC)'}
        onKeyDown={e=>{if(e.key==='Enter'){setOpen(false);onSearch&&onSearch(value);}}}
        onFocus={()=>{if(filtered.length>0&&value) setOpen(true);}}/>
      {open && (
        <div className="search-suggestions">
          {filtered.map(s=>(
            <div key={s.q} className="suggestion-item" onClick={()=>select(s)}>
              <span>{s.label}</span>
              <span className={`badge ${s.type==='crypto'?'badge-yellow':'badge-blue'}`}>{s.q}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ImageDropzone({onImage}) {
  const [drag, setDrag] = useState(false);
  const [preview, setPreview] = useState(null);
  const inputRef = useRef();

  const processFile = file => {
    if(!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      const result = e.target.result;
      setPreview(result);
      // Extract base64 and media type
      const [header, data] = result.split(',');
      const mediaType = header.match(/data:([^;]+)/)[1];
      onImage(data, mediaType);
    };
    reader.readAsDataURL(file);
  };

  return (
    <div>
      <div
        className={`drop-zone ${drag?'active':''}`}
        onDragOver={e=>{e.preventDefault();setDrag(true);}}
        onDragLeave={()=>setDrag(false)}
        onDrop={e=>{e.preventDefault();setDrag(false);processFile(e.dataTransfer.files[0]);}}
        onClick={()=>inputRef.current.click()}
      >
        📊 차트 이미지를 드래그하거나 클릭하여 업로드
        <input ref={inputRef} type="file" accept="image/*" style={{display:'none'}}
          onChange={e=>processFile(e.target.files[0])}/>
      </div>
      {preview && <img src={preview} className="img-preview" alt="preview"/>}
    </div>
  );
}

function toTvSymbol(ticker, query='') {
  if (!ticker) return 'BTCUSD';
  const low = ticker.toLowerCase();
  const q = (query||'').toLowerCase().trim();

  // Korean stocks (.KS / .KQ)
  if (/\.(ks|kq)$/i.test(ticker)) {
    return 'KRX:' + ticker.replace(/\.(ks|kq)$/i, '').toUpperCase();
  }

  // Direct Binance symbol from BINANCE_SYMBOL_MAP (by ticker or original query)
  if (BINANCE_SYMBOL_MAP[low]) return 'BINANCE:' + BINANCE_SYMBOL_MAP[low];
  if (q && BINANCE_SYMBOL_MAP[q]) return 'BINANCE:' + BINANCE_SYMBOL_MAP[q];

  // CoinGecko ID → find matching Binance symbol via reverse CRYPTO_MAP lookup
  const cgToBinance = {
    'bitcoin':'BTCUSDT','ethereum':'ETHUSDT','solana':'SOLUSDT','ripple':'XRPUSDT',
    'binancecoin':'BNBUSDT','dogecoin':'DOGEUSDT','cardano':'ADAUSDT',
    'avalanche-2':'AVAXUSDT','matic-network':'MATICUSDT','chainlink':'LINKUSDT',
    'polkadot':'DOTUSDT','cosmos':'ATOMUSDT','litecoin':'LTCUSDT','tron':'TRXUSDT',
    'shiba-inu':'SHIBUSDT','near':'NEARUSDT','aptos':'APTUSDT','sui':'SUIUSDT',
    'arbitrum':'ARBUSDT','optimism':'OPUSDT','the-open-network':'TONUSDT',
    'internet-computer':'ICPUSDT','stellar':'XLMUSDT','uniswap':'UNIUSDT',
    'hyperliquid':'HYPEUSDT','pudgy-penguins':'PENGUUSDT','movement':'MOVEUSDT',
    'official-trump':'TRUMPUSDT','pepe':'PEPEUSDT','bonk':'BONKUSDT',
    'dogwifcoin':'WIFUSDT','kaspa':'KASUSDT','render-token':'RENDERUSDT',
    'the-sandbox':'SANDUSDT','decentraland':'MANAUSDT','axie-infinity':'AXSUSDT',
    'starknet':'STRKUSDT','celestia':'TIAUSDT','ethena':'ENAUSDT',
    'injective':'INJUSDT','sei-network':'SEIUSDT','fetch-ai':'FETUSDT',
    'worldcoin-wld':'WLDUSDT','jupiter-exchange-solana':'JUPUSDT',
    'pyth-network':'PYTHUSDT','notcoin':'NOTUSDT','floki-inu':'FLOKIUSDT',
    'berachain-bera':'BERAUSDT','sonic-3':'SUSDT','zksync':'ZKUSDT',
    'usual':'USUALUSDT','kaito':'KAITOUSDT',
  };
  if (cgToBinance[low]) return 'BINANCE:' + cgToBinance[low];

  // If ticker ends with USDT it's already an exchange symbol
  if (/USDT$/i.test(ticker)) return 'BINANCE:' + ticker.toUpperCase();

  // US stocks - TradingView resolves automatically
  return ticker.toUpperCase();
}

function AnalysisTab({apiKey, settings, serverHasKey}) {
  const [query, setQuery]   = useState('');
  const [mode, setMode]     = useState('auto'); // 'auto' | 'stock' | 'crypto'
  const [loading, setLoading] = useState(false);
  const [step, setStep]     = useState('');
  const [report, setReport] = useState(null);
  const [error, setError]   = useState('');
  const [phase1, setPhase1] = useState(null);   // immediate local data
  const [aiLoading, setAiLoading] = useState(false);
  const [analysisTf, setAnalysisTf] = useState('1d');
  const [lastTarget, setLastTarget] = useState('');
  const [chartTab, setChartTab] = useState('mine');
  const [imgB64, setImgB64] = useState(null);
  const [imgType, setImgType] = useState(null);
  const [logs, setLogs]     = useState(()=>ls_get('cs_logs',[]));

  const saveLog = r => {
    const entry = {date:new Date().toISOString(), ticker:r.ticker, position:r.position, confidence:r.confidence, summary:r.summary?.slice(0,200)};
    const updated = [...ls_get('cs_logs',[]), entry].slice(-200);
    ls_set('cs_logs', updated);
    setLogs(updated);
  };

  const checkReady = () => {
    if(!serverHasKey && !apiKey) {
      setError('API 키가 필요합니다. 우측 상단 ⚙️ 에서 설정해주세요.');
      return false;
    }
    return true;
  };

  async function handleAnalyze(queryVal, modeVal, tfArg) {
    const target = (queryVal||query).trim();
    if (!target) return;
    if (!checkReady()) return;
    const effectiveMode = modeVal||mode;
    const tfId = (typeof tfArg === 'string' && tfArg) ? tfArg : '1d';
    setAnalysisTf(tfId); setLastTarget(target);

    setLoading(true);
    setError('');
    setReport(null);
    setPhase1(null);

    try {
      // ── Phase 1: fast (data + local indicators) ─────────────────
      setStep('ticker');
      let p1;
      try {
        setStep('data');
        p1 = await fetchAnalysisPhase1(target, effectiveMode, tfId);
        setPhase1(p1);
      } catch(e) {
        // Data fetch failed → fall back to pure AI text analysis
        setStep('report');
        const r = await analyzeDirectly(target, apiKey);
        r._dataError = `가격 데이터 수집 실패. 텍스트 기반 분석으로 대체합니다.`;
        r._query = target;
        setReport(r);
        return;
      } finally {
        setLoading(false);
        setStep('');
      }

      // ── Phase 2: async AI analysis ───────────────────────────────
      setAiLoading(true);
      setStep('vision');
      try {
        const r = await fetchAnalysisPhase2(p1, apiKey);
        r._query = target;
        setReport(r);
        // Save to logs
        const entry = {date:new Date().toISOString(), ticker:r.ticker, position:r.position, confidence:r.confidence, stance:r.stance, summary:r.summary,
          tf:tfId, score:r.score, price:r.price, entry:r.computed?.tradePlan?.entry1, stop:r.stop_loss, tp1:r.target_price};
        const prev = ls_get('cs_logs')||[];
        ls_set('cs_logs', [...prev.slice(-99), entry]);
        setLogs(prev => [...prev.slice(-99), entry]);
        if(settings.autoAlert && r.position==='long' && (r.score??-999)>=settings.alertThreshold) {
          if(settings.telegramToken) sendTelegramAlert(r, settings).catch(()=>{});
          if(settings.discordWebhook) sendDiscordAlert(r, settings).catch(()=>{});
        }
      } catch(e) {
        console.error('AI 분석 실패:', e);
        // Show partial report with local data only
        const lr = buildLocalReport(p1);

// ─── Compare Tab ──────────────────────────────────────────────────────────────
function CompareTab({apiKey, serverHasKey}) {
  const [tickers, setTickers] = useState(['AAPL','NVDA']);
  const [input, setInput]     = useState('');
  const [loading, setLoading] = useState(false);
  const [results, setResults] = useState([]);
  const [error, setError]     = useState('');

  const addTicker = () => {
    if(input.trim() && !tickers.includes(input.trim().toUpperCase())) {
      setTickers(prev=>[...prev, input.trim().toUpperCase()]);
      setInput('');
    }
  };

  const removeTicker = t => setTickers(prev=>prev.filter(x=>x!==t));

  const runCompare = async () => {
    if(!serverHasKey && !apiKey) { setError('API 키가 필요합니다.'); return; }
    if(tickers.length<2) { setError('최소 2개 종목이 필요합니다.'); return; }
    setLoading(true); setError(''); setResults([]);
    try {
      const rs = await Promise.all(tickers.map(t=>
        analyzeFull(t, apiKey, ()=>{}).catch(e=>({ticker:t,error:e.message,position:'hold',confidence:0}))
      ));
      setResults(rs);
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  };

  return (
    <div>
      <div className="card">
        <div className="card-title">⚖ 종목 비교 분석</div>
        <div style={{display:'flex',gap:8,marginBottom:12}}>
          {tickers.map(t=>(
            <span key={t} style={{display:'flex',alignItems:'center',gap:4,background:'#0f172a',border:'1px solid #334155',borderRadius:6,padding:'4px 10px',fontSize:'.85rem'}}>
              {t}
              <span style={{cursor:'pointer',color:'#f87171',marginLeft:4}} onClick={()=>removeTicker(t)}>×</span>
            </span>
          ))}
        </div>
        <div style={{display:'flex',gap:8,marginBottom:12}}>
          <input value={input} onChange={e=>setInput(e.target.value)} placeholder="종목 추가 (예: TSLA)"
            onKeyDown={e=>e.key==='Enter'&&addTicker()} style={{flex:1}}/>
          <button className="btn-secondary" onClick={addTicker}>추가</button>
          <button className="btn-primary" onClick={runCompare} disabled={loading||tickers.length<2}>비교 분석</button>
        </div>
        {error && <div className="alert-box alert-err">{error}</div>}
      </div>

      {loading && (
        <div className="card"><div className="loader"><div className="spinner"/><p style={{color:'#8794a8',marginTop:12}}>{tickers.length}개 종목 분석 중...</p></div></div>
      )}

      {results.length>0 && (
        <>
          <div className="card">
            <div className="card-title">📊 비교 요약</div>
            <table>
              <thead><tr><th>종목</th><th>포지션</th><th>과거 상승률</th><th>현재가</th><th>목표가</th><th>리스크</th></tr></thead>
              <tbody>
                {results.map((r,i)=>(
                  <tr key={i}>
                    <td style={{fontWeight:700,color:'#60a5fa'}}>{r.ticker}</td>
                    <td><span className={`badge ${r.position==='long'?'badge-green':r.position==='short'?'badge-red':'badge-yellow'}`}>{r.position||'hold'}</span></td>
                    <td>{r.confidence!=null ? `${r.confidence}%` : '—'}</td>
                    <td>{r.price?`$${r.price.toLocaleString()}`:'-'}</td>
                    <td>{r.target_price?`$${r.target_price.toLocaleString()}`:'-'}</td>
                    <td><span className={`badge ${r.risk_level==='low'?'badge-green':r.risk_level==='high'?'badge-red':'badge-yellow'}`}>{r.risk_level||'-'}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {results.map((r,i)=>(
            <div key={i}>
              {r.error ? (
                <div className="card"><div className="alert-box alert-err"><b>{r.ticker}</b>: {r.error}</div></div>
              ) : (
                <div><ReportHero report={r}/><AnalysisSection report={r}/><ConclusionSection report={r}/></div>
              )}
            </div>
          ))}
        </>
      )}
    </div>
  );
}

// ─── Performance Tab ──────────────────────────────────────────────────────────
function PerformanceTab({apiKey, serverHasKey}) {
  const [logs, setLogs]   = useState(()=>ls_get('cs_logs',[]));
  const [evalResult, setEvalResult] = useState(null);
  const [loading, setLoading] = useState(false);

  const stats = useMemo(()=>{
    if(!logs.length) return null;
    const total = logs.length;
    const byPos = logs.reduce((a,l)=>{a[l.position]=(a[l.position]||0)+1;return a;},{});
    const avgConf = logs.reduce((a,l)=>a+(l.confidence||50),0)/total;
    const recent = [...logs].reverse().slice(0,10);
    return {total, byPos, avgConf: avgConf.toFixed(1), recent};
  },[logs]);

  const autoEvaluate = async () => {
    if(!serverHasKey && !apiKey) return;
    if(logs.length<5) { alert('분석 기록이 5개 이상 필요합니다.'); return; }
    setLoading(true);
    try {
      const sample = [...logs].reverse().slice(0,20);
      const summary = sample.map(l=>`${l.date?.slice(0,10)} ${l.ticker} ${l.position} ${l.confidence}%`).join('\n');
      const text = await callGemini(GEMINI_REPORT_MODEL, [{
        text: `다음은 AI 차트 분석 시스템의 최근 분석 기록입니다:\n\n${summary}\n\n이 분석 패턴을 평가해주세요: 편향성, 신뢰도 분포, 포지션 분포의 적절성, 개선 제안 등을 한국어로 분석해주세요.`,
      }], apiKey);
      setEvalResult(text);
    } catch(e) { console.error(e); }
    finally { setLoading(false); }
  };

  return (
    <div>
      <div className="card">
        <div className="card-title" style={{justifyContent:'space-between'}}>
          <span>📈 성과 분석</span>
          <div style={{display:'flex',gap:8}}>
            <button className="btn-secondary" style={{padding:'6px 12px',fontSize:'.8rem'}} onClick={autoEvaluate} disabled={loading}>AI 평가</button>
            <button className="btn-danger"    style={{padding:'6px 12px',fontSize:'.8rem'}} onClick={()=>{ls_set('cs_logs',[]);setLogs([]);setEvalResult(null);}}>초기화</button>
          </div>
        </div>
        {!stats ? (
          <div className="no-data">분석 기록이 없습니다.<br/>📊 분석 탭에서 종목을 분석해보세요.</div>
        ) : (
          <>
            <div className="grid-3" style={{marginBottom:16}}>
              <div className="stat-card"><div className="stat-value">{stats.total}</div><div className="stat-label">총 분석</div></div>
              <div className="stat-card"><div className="stat-value">{stats.avgConf}%</div><div className="stat-label">평균 신뢰도</div></div>
              <div className="stat-card"><div className="stat-value">{stats.byPos.long||0}</div><div className="stat-label">롱 신호</div></div>
            </div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16}}>
              {Object.entries(stats.byPos).map(([pos,cnt])=>(
                <div key={pos} className="stat-card" style={{flex:1,minWidth:80}}>
                  <div className={`stat-value pos-${pos}`}>{cnt}</div>
                  <div className="stat-label">{pos}</div>
                </div>
              ))}
            </div>
            <table>
              <thead><tr><th>날짜</th><th>티커</th><th>포지션</th><th>과거 상승률</th></tr></thead>
              <tbody>
                {[...logs].reverse().slice(0,20).map((l,i)=>(
                  <tr key={i}>
                    <td style={{fontSize:'.75rem',color:'#8794a8'}}>{l.date?.slice(0,16).replace('T',' ')}</td>
                    <td style={{fontWeight:700}}>{l.ticker}</td>
                    <td><span className={`badge ${l.position==='long'?'badge-green':l.position==='short'?'badge-red':'badge-yellow'}`}>{l.position}</span></td>
                    <td>{l.confidence!=null ? `${l.confidence}%` : '—'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </>
        )}
      </div>
      {loading && <div className="card"><div className="loader"><div className="spinner"/></div></div>}
      {evalResult && (
        <div className="card">
          <div className="card-title">🤖 AI 성과 평가</div>
          <div className="report-pre">{evalResult}</div>
        </div>
      )}
    </div>
  );
}

// ─── Backtest Tab ─────────────────────────────────────────────────────────────
function BacktestTab() {
  const [query, setQuery]   = useState('AAPL');
  const [period, setPeriod] = useState('6mo');
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError]   = useState('');
  const chartRef = useRef();
  const [chartData, setChartData] = useState(null);

  // 결과 카드가 렌더된 뒤에 차트를 그린다 (렌더 전에는 chartRef가 null)
  useEffect(() => {
    if (!result || !chartData || loading || !chartRef.current) return;
    let cancelled = false;
    (async () => {
      try {
        await ensurePlotly();
        if (cancelled || !chartRef.current) return;
        const {ohlcv, ticker} = chartData;
        const closes = ohlcv.map(d=>d.close);
        const dates  = ohlcv.map(d=>d.date);
        const ma20   = movingAverage(closes,20);
        const ma60   = movingAverage(closes,60);

        const signals = {buy:[], sell:[], buyDates:[], sellDates:[]};
        for(let i=1;i<closes.length-1;i++) {
          if(!ma20[i-1]||!ma60[i-1]||!ma20[i]||!ma60[i]) continue;
          if(ma20[i-1]<=ma60[i-1] && ma20[i]>ma60[i]) { signals.buy.push(closes[i]); signals.buyDates.push(dates[i]); }
          if(ma20[i-1]>=ma60[i-1] && ma20[i]<ma60[i]) { signals.sell.push(closes[i]); signals.sellDates.push(dates[i]); }
        }

        const layout = {
          paper_bgcolor:'#0f172a',plot_bgcolor:'#0f172a',
          font:{color:'#e2e8f0'},
          title:{text:`${ticker} - MA20/MA60 크로스오버 백테스트`,font:{size:13,color:'#60a5fa'}},
          xaxis:{gridcolor:'#1e293b'},yaxis:{gridcolor:'#1e293b'},
          legend:{bgcolor:'transparent'},margin:{l:50,r:20,t:50,b:40},
        };
        Plotly.react(chartRef.current, [
          {type:'scatter',name:'가격',x:dates,y:closes,mode:'lines',line:{color:'#60a5fa',width:1.5}},
          {type:'scatter',name:'MA20',x:dates,y:ma20,mode:'lines',line:{color:'#fbbf24',width:1.5},connectgaps:false},
          {type:'scatter',name:'MA60',x:dates,y:ma60,mode:'lines',line:{color:'#a78bfa',width:1.5},connectgaps:false},
          {type:'scatter',name:'매수',x:signals.buyDates,y:signals.buy,mode:'markers',marker:{symbol:'triangle-up',size:12,color:'#22c55e'}},
          {type:'scatter',name:'매도',x:signals.sellDates,y:signals.sell,mode:'markers',marker:{symbol:'triangle-down',size:12,color:'#ef4444'}},
        ], layout, {responsive:true});
      } catch(e) { if(!cancelled) setError(e.message); }
    })();
    return () => { cancelled = true; };
  }, [result, chartData, loading]);

  const runTest = async () => {
    setLoading(true); setError(''); setResult(null);
    try {
      const ohlcv = await fetchOHLCV(query, period);
      const {ticker} = resolveTicker(query);
      const res = runBacktest(ohlcv, ticker);
      setResult(res);

      setChartData({ohlcv, ticker});
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  };

  const fmtPct = v => `${v>=0?'+':''}${v.toFixed(2)}%`;
  const fmtColor = v => v>=0?'#34d399':'#f87171';

  return (
    <div>
      <div className="card">
        <div className="card-title">🔬 MA20/MA60 크로스오버 백테스트</div>
        <div style={{display:'flex',gap:8,marginBottom:12}}>
          <SearchAutocomplete value={query} onChange={setQuery} onSearch={v=>setQuery(v)}/>
          <select value={period} onChange={e=>setPeriod(e.target.value)} style={{width:'auto',minWidth:100}}>
            <option value="3mo">3개월</option>
            <option value="6mo">6개월</option>
            <option value="1y">1년</option>
            <option value="2y">2년</option>
            <option value="5y">5년</option>
          </select>
          <button className="btn-primary" onClick={runTest} disabled={loading||!query.trim()}>백테스트</button>
        </div>
        {error && <div className="alert-box alert-err">{error}</div>}
      </div>

      {loading && <div className="card"><div className="loader"><div className="spinner"/><p style={{color:'#8794a8',marginTop:12}}>데이터 수집 및 백테스트 실행 중...</p></div></div>}

      {result && !loading && (
        <>
          <div className="card">
            <div className="card-title">📊 백테스트 결과: {result.ticker}</div>
            <div className="grid-3" style={{marginBottom:16}}>

// ─── Portfolio Tab ────────────────────────────────────────────────────────────
function PortfolioTab() {
  const [portfolio, setPortfolio] = useState(()=>loadPortfolio());
  const [withPrices, setWithPrices] = useState([]);
  const [loading, setLoading]       = useState(false);
  const [corrData, setCorrData]     = useState(null);
  const [corrLoading, setCorrLoading] = useState(false);
  const [form, setForm] = useState({ticker:'',shares:'',avgCost:''});
  const [formErr, setFormErr] = useState('');
  const [tab, setTab]    = useState('holdings');

  const refreshPrices = async (p) => {
    setLoading(true);
    try {
      const updated = await getPortfolioWithPrices(p||portfolio);
      setWithPrices(updated);
    } catch(e) { console.error(e); }
    finally { setLoading(false); }
  };

  useEffect(()=>{ if(portfolio.length) refreshPrices(portfolio); },[]);

  const addItem = () => {
    if(!form.ticker||!form.shares||!form.avgCost){setFormErr('모든 필드를 입력해주세요.');return;}
    const item = {id:Date.now(), ticker:form.ticker.trim().toUpperCase(), shares:parseFloat(form.shares), avgCost:parseFloat(form.avgCost)};
    const next = [...portfolio, item];
    setPortfolio(next); savePortfolio(next);
    setForm({ticker:'',shares:'',avgCost:''}); setFormErr('');
    refreshPrices(next);
  };

  const removeItem = id => {
    const next = portfolio.filter(p=>p.id!==id);
    setPortfolio(next); savePortfolio(next);
    setWithPrices(prev=>prev.filter(p=>p.id!==id));
  };

  const totalValue  = withPrices.reduce((a,p)=>a+(p.currentValue||0),0);
  const totalCost   = portfolio.reduce((a,p)=>a+p.avgCost*p.shares,0);
  const totalPnl    = totalValue - totalCost;
  const totalPnlPct = totalCost>0 ? totalPnl/totalCost*100 : 0;

  const computeCorr = async () => {
    if(portfolio.length<2){alert('최소 2개 종목이 필요합니다.');return;}
    setCorrLoading(true);
    try { const r = await computeCorrelationMatrix(portfolio); setCorrData(r); }
    catch(e) { alert('상관관계 계산 실패: '+e.message); }
    finally { setCorrLoading(false); }
  };

  const corrColor = v => {
    const r = Math.round(255*(v>0?0:Math.abs(v)));
    const g = Math.round(255*(v>0?v:0));
    return `rgba(${r},${g},60,${Math.abs(v)*0.8+0.2})`;
  };

  return (
    <div>
      <div className="card">
        <div className="card-title">🏦 포트폴리오 관리</div>
        <div className="tabs-inner">
          {[['holdings','보유 종목'],['add','종목 추가'],['correlation','상관관계']].map(([k,l])=>(
            <button key={k} className={`tab-inner-btn ${tab===k?'active':''}`} onClick={()=>setTab(k)}>{l}</button>
          ))}
        </div>

        {tab==='holdings' && (
          <>
            {loading && <div style={{textAlign:'center',padding:20,color:'#8794a8'}}>가격 업데이트 중...</div>}
            {portfolio.length===0 ? (
              <div className="no-data">포트폴리오가 비어있습니다.<br/>종목 추가 탭에서 추가해보세요.</div>
            ) : (
              <>
                <div className="grid-3" style={{marginBottom:16}}>
                  <div className="stat-card"><div className="stat-value">${totalValue.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div className="stat-label">총 평가금액</div></div>
                  <div className="stat-card"><div className="stat-value" style={{color:totalPnl>=0?'#34d399':'#f87171'}}>{totalPnl>=0?'+':''}{totalPnlPct.toFixed(2)}%</div><div className="stat-label">총 손익률</div></div>
                  <div className="stat-card"><div className="stat-value">{portfolio.length}</div><div className="stat-label">보유 종목</div></div>
                </div>
                <table>
                  <thead><tr><th>종목</th><th>수량</th><th>평균단가</th><th>현재가</th><th>손익</th><th>손익률</th><th></th></tr></thead>
                  <tbody>
                    {withPrices.map(p=>(
                      <tr key={p.id}>
                        <td style={{fontWeight:700,color:'#60a5fa'}}>{p.ticker}</td>
                        <td>{p.shares}</td>
                        <td>${p.avgCost?.toLocaleString()}</td>
                        <td>{p.currentPrice?`$${p.currentPrice.toLocaleString(undefined,{maximumFractionDigits:2})}`:'-'}</td>
                        <td style={{color:p.pnl>=0?'#34d399':'#f87171'}}>{p.pnl!=null?`${p.pnl>=0?'+':''}$${Math.abs(p.pnl).toFixed(0)}`:'-'}</td>
                        <td><span className={`badge ${(p.pnlPct||0)>=0?'badge-green':'badge-red'}`}>{p.pnlPct!=null?`${p.pnlPct>=0?'+':''}${p.pnlPct.toFixed(2)}%`:'-'}</span></td>
                        <td><button className="btn-danger" style={{padding:'2px 8px',fontSize:'.75rem'}} onClick={()=>removeItem(p.id)}>삭제</button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                <button className="btn-secondary" style={{marginTop:12,padding:'6px 14px',fontSize:'.85rem'}} onClick={()=>refreshPrices()}>🔄 가격 새로고침</button>
              </>
            )}
          </>
        )}

        {tab==='add' && (
          <div style={{maxWidth:400}}>
            <div className="settings-group">
              <label>티커</label>
              <input value={form.ticker} onChange={e=>setForm(f=>({...f,ticker:e.target.value}))} placeholder="예: AAPL, 005930.KS, BTC"/>
            </div>
            <div className="settings-group">
              <label>수량</label>
              <input type="number" value={form.shares} onChange={e=>setForm(f=>({...f,shares:e.target.value}))} placeholder="예: 10"/>
            </div>
            <div className="settings-group">
              <label>평균 매입단가 (USD)</label>
              <input type="number" value={form.avgCost} onChange={e=>setForm(f=>({...f,avgCost:e.target.value}))} placeholder="예: 150.00"/>
            </div>
            {formErr && <div className="alert-box alert-err">{formErr}</div>}
            <button className="btn-primary" onClick={addItem}>종목 추가</button>
          </div>
        )}

        {tab==='correlation' && (
          <>
            <button className="btn-primary" onClick={computeCorr} disabled={corrLoading||portfolio.length<2} style={{marginBottom:16}}>
              {corrLoading?'계산 중...':'상관관계 분석'}
            </button>
            {corrData && (
              <div className="correlation-grid">
                <table className="corr-table">
                  <thead>
                    <tr><th></th>{corrData.labels.map(l=><th key={l} style={{color:'#94a3b8',padding:'6px 8px'}}>{l}</th>)}</tr>
                  </thead>
                  <tbody>
                    {corrData.matrix.map((row,i)=>(
                      <tr key={i}>
                        <td style={{color:'#94a3b8',padding:'6px 8px',fontWeight:700}}>{corrData.labels[i]}</td>
                        {row.map((v,j)=>(
                          <td key={j} className="corr-cell" style={{background:corrColor(v),color:'#fff'}}>
                            {v.toFixed(2)}
                          </td>
                        ))}
                      </tr>
                    ))}
                  </tbody>
                </table>
                <p style={{fontSize:'.75rem',color:'#8794a8',marginTop:8}}>
                  녹색: 양의 상관관계 / 적색: 음의 상관관계 / 백색: 무상관
                </p>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

// ─── Monitor Tab ──────────────────────────────────────────────────────────────
function MonitorTab({apiKey, settings, serverHasKey}) {
  const [watchlist, setWatchlist] = useState(()=>loadWatchlist());
  const [prices, setPrices]       = useState({});
  const [input, setInput]         = useState('');
  const [running, setRunning]     = useState(false);
  const [alerts, setAlerts]       = useState([]);
  const intervalRef = useRef(null);

  const addTicker = () => {
    if(!input.trim()) return;
    const t = input.trim().toUpperCase();
    if(!watchlist.includes(t)) {
      const next = [...watchlist, t];
      setWatchlist(next); saveWatchlist(next);
    }
    setInput('');
  };

  const removeTicker = t => {
    const next = watchlist.filter(x=>x!==t);
    setWatchlist(next); saveWatchlist(next);
  };

  const fetchAllPrices = async () => {
    const updates = {};
    await Promise.all(watchlist.map(async t => {
      try {
        const p = await fetchCurrentPrice(t);
        if(p) updates[t] = p;
      } catch {}
    }));
    setPrices(prev => {
      // Check price alerts
      const newAlerts = [];
      Object.entries(updates).forEach(([t,p]) => {
        const old = prev[t];
        if(old) {
          const chg = (p-old)/old*100;
          if(Math.abs(chg)>=settings.alertThreshold/10) {
            const alert = {ticker:t, oldPrice:old, newPrice:p, change:chg, time:new Date().toLocaleTimeString()};
            newAlerts.push(alert);
            const report = {ticker:t, price:p, position:chg>0?'long':'short', confidence:70, summary:`${t} 가격 급변: ${chg.toFixed(2)}%`};
            if(settings.telegramToken) sendTelegramAlert(report, settings).catch(()=>{});
            if(settings.discordWebhook) sendDiscordAlert(report, settings).catch(()=>{});
          }
        }
      });
      if(newAlerts.length) setAlerts(prev=>[...newAlerts,...prev].slice(0,50));
      return {...prev, ...updates};
    });
  };

  const startMonitor = () => {
    if(intervalRef.current) return;
    fetchAllPrices();
    const iv = parseInt(settings.monitorInterval||60) * 1000;
    intervalRef.current = setInterval(fetchAllPrices, iv);
    setRunning(true);
  };

  const stopMonitor = () => {
    if(intervalRef.current) { clearInterval(intervalRef.current); intervalRef.current=null; }
    setRunning(false);
  };

  useEffect(()=>()=>{ if(intervalRef.current) clearInterval(intervalRef.current); },[]);

  const priceChange = (t) => {
    // We don't have yesterday's price, just show current
    return null;
  };

  return (
    <div>
      <div className="card">
        <div className="card-title" style={{justifyContent:'space-between'}}>
          <span>👁 모니터링</span>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <span style={{fontSize:'.8rem',color:running?'#34d399':'#8794a8'}}>
              {running?`🟢 모니터링 중 (${settings.monitorInterval}초 간격)`:'⚪ 중지됨'}
            </span>
            {running
              ? <button className="btn-danger" style={{padding:'6px 14px',fontSize:'.85rem'}} onClick={stopMonitor}>중지</button>
              : <button className="btn-success" style={{padding:'6px 14px',fontSize:'.85rem'}} onClick={startMonitor} disabled={!watchlist.length}>시작</button>
            }
          </div>
        </div>

        <div style={{display:'flex',gap:8,marginBottom:12}}>
          <input value={input} onChange={e=>setInput(e.target.value)} placeholder="감시 종목 추가 (예: AAPL, BTC)"
            onKeyDown={e=>e.key==='Enter'&&addTicker()} style={{flex:1}}/>
          <button className="btn-secondary" onClick={addTicker}>추가</button>
          <button className="btn-secondary" onClick={fetchAllPrices} disabled={!watchlist.length}>🔄</button>
        </div>

        {watchlist.length===0 ? (
          <div className="no-data">감시 종목을 추가해주세요.</div>
        ) : (
          watchlist.map(t=>(
            <div key={t} className="monitor-item">
              <div style={{display:'flex',align:'center',gap:12}}>
                <span style={{fontWeight:700,color:'#60a5fa'}}>{t}</span>
                {prices[t] && <span style={{color:'#e2e8f0'}}>${prices[t].toLocaleString(undefined,{maximumFractionDigits:4})}</span>}
                {!prices[t] && <span style={{color:'#8794a8',fontSize:'.8rem'}}>가격 대기중...</span>}
              </div>
              <button className="btn-danger" style={{padding:'2px 8px',fontSize:'.75rem'}} onClick={()=>removeTicker(t)}>삭제</button>
            </div>
          ))
        )}
      </div>

      {alerts.length>0 && (
        <div className="card">
          <div className="card-title" style={{justifyContent:'space-between'}}>
            <span>🔔 알림 기록</span>
            <button className="btn-secondary" style={{padding:'4px 10px',fontSize:'.75rem'}} onClick={()=>setAlerts([])}>초기화</button>
          </div>
          {alerts.map((a,i)=>(
            <div key={i} className={`alert-box ${a.change>0?'alert-ok':'alert-err'}`} style={{marginBottom:6}}>
              <b>{a.ticker}</b> {a.time} — ${a.oldPrice.toFixed(2)} → ${a.newPrice.toFixed(2)} ({a.change>0?'+':''}{a.change.toFixed(2)}%)
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

          <div className="subtitle">AI 차트 분석 · Google Gemini · 서버 불필요</div>
        </div>
        <div style={{marginLeft:'auto',display:'flex',gap:8,alignItems:'center'}}>
          {statusBadge}
          {/* 프록시/하드코딩 배포 시엔 설정 버튼 숨김 */}
          {!PROXY_URL && !DEPLOY_KEY && (
            <button className="btn-secondary" style={{padding:'6px 12px',fontSize:'.85rem'}} onClick={()=>setShowSettings(true)}>⚙️</button>
          )}
        </div>
      </div>

      <div className="tabs">
        {TABS.map(t=>(
          <button key={t.id} className={`tab-btn ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>{t.label}</button>
        ))}
      </div>

      <div className="main-content">
        {tab==='analysis'    && <AnalysisTab    apiKey={activeKey} settings={settings} serverHasKey={false}/>}
        {tab==='compare'     && <CompareTab     apiKey={activeKey} serverHasKey={false}/>}
        {tab==='performance' && <PerformanceTab apiKey={activeKey} serverHasKey={false}/>}
        {tab==='backtest'    && <BacktestTab/>}
        {tab==='portfolio'   && <PortfolioTab/>}
        {tab==='monitor'     && <MonitorTab     apiKey={activeKey} settings={settings} serverHasKey={false}/>}
      </div>

      {showSettings && <SettingsDrawer settings={settings} onSave={handleSettingsSave} onClose={()=>setShowSettings(false)} serverHasKey={false}/>}
      {showApiModal  && <ApiKeyModal onSave={handleApiSave} onSkip={()=>setShowApiModal(false)}/>}
    </ErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
